name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  openspec:
    name: OpenSpec workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      # The mise postinstall hook completes the MoonBit SDK (core and moonx).
      - name: Initialize the MoonBit package registry
        run: mise exec -- moon update

      - name: Verify shared OpenSpec workflow
        run: mise run openspec:verify
